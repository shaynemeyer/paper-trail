services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paper_trail
      POSTGRES_PASSWORD: paper_trail
      POSTGRES_DB: paper_trail
    ports:
      - "5443:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_trail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
